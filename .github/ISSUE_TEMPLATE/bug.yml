name: Bug report
description: Report a reproducible ODOC desktop problem
body:
  - type: input
    id: version
    attributes:
      label: ODOC version and channel
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, document text, titles and local paths.
